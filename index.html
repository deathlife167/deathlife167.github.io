<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Grid: The Ultimate Reality</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05070f; font-family: 'Courier New', Courier, monospace; color: #00ffcc; }
        
        #setup-screen { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #101525 0%, #05070f 100%); 
            display: flex !important; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            padding: 20px; 
            text-align: center; 
            border: 4px solid #1f2d5a; 
        }
        
        .glitch-title { font-size: 2.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 4px; color: #ff0055; text-shadow: 2px 2px #00ffcc, -2px -2px #ff0055; margin-bottom: 30px; }
        .panel { background: rgba(16, 21, 37, 0.8); border: 2px solid #00ffcc; border-radius: 8px; padding: 25px; max-width: 450px; width: 100%; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        .step { display: none; }
        .step.active { display: block; }
        .btn-grid { display: grid; grid-template-columns: 140px 140px; gap: 15px; justify-content: center; margin-top: 20px; }
        button { background: #070a14; border: 2px solid #ff0055; color: #ff0055; padding: 12px 20px; font-size: 1rem; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.3s ease; }
        button:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055; }
        input[type="text"] { background: #05070f; border: 2px solid #00ffcc; padding: 12px; color: #00ffcc; font-size: 1.1rem; font-family: inherit; text-align: center; width: 100%; margin-top: 15px; border-radius: 4px; outline: none; }
        .instructions { font-size: 0.95rem; line-height: 1.5; color: #94a3b8; margin-top: 15px; text-align: left; background: #070a14; padding: 15px; border-left: 3px solid #00ffcc; max-height: 180px; overflow-y: auto; white-space: pre-line; }
        #game-container { width: 100%; height: 100%; display: none; }
        #ad-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,7,15,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #ff0055; }
        .ad-box { background: #101525; border: 3px solid #ff0055; padding: 30px; border-radius: 8px; text-align: center; max-width: 400px; }
        #ending-screen { position: absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:30; padding:20px; text-align:center; }
        .ending-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; }
        .ending-story { font-size: 1.2rem; max-width: 600px; line-height: 1.6; margin-bottom: 30px; color: #e2e8f0; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="glitch-title">CYBER-GRID</div>
        <div class="panel">
            <div id="step-lang" class="step active">
                <p style="margin-top:0;">SELECT TRANSMISSION LANGUAGE</p>
                <div class="btn-grid">
                    <button onclick="selectLang('en')">ENGLISH</button>
                    <button onclick="selectLang('bn')">বাংলা</button>
                </div>
            </div>

            <div id="step-device" class="step">
                <p id="device-prompt" style="margin-top:0;"></p>
                <div class="btn-grid">
                    <button id="btn-pc" onclick="selectDevice('PC')">PC / LAPTOP</button>
                    <button id="btn-mobile" onclick="selectDevice('Mobile')">MOBILE</button>
                </div>
            </div>

            <div id="step-name" class="step">
                <p id="name-prompt" style="margin-top:0;"></p>
                <input type="text" id="player-name" maxlength="15" value="Operator_01">
                <button onclick="confirmName()" style="margin-top:20px; width:100%;">PROCEED</button>
            </div>

            <div id="step-tutorial" class="step">
                <p id="tutorial-title" style="margin-top:0; font-weight:bold; color:#00ffcc;"></p>
                <div id="tutorial-text" class="instructions"></div>
                <button onclick="startGame()" style="margin-top:20px; width:100%;" id="btn-start-game"></button>
            </div>
        </div>
    </div>

    <div id="ad-modal">
        <div class="ad-box">
            <h2 id="ad-title">SYSTEM CRASHED</h2>
            <p id="ad-desc"></p>
            <div style="margin-top:25px; display:flex; gap:15px; justify-content:center;">
                <button onclick="watchRewardAd()" style="border-color:#00ffcc; color:#00ffcc;" id="btn-watch-ad"></button>
                <button onclick="skipAd()" style="border-color:#64748b; color:#64748b;" id="btn-skip-ad"></button>
            </div>
        </div>
    </div>

    <div id="ending-screen">
        <div class="ending-title" id="end-title"></div>
        <div class="ending-story" id="end-story"></div>
        <button onclick="location.reload()" id="btn-restart-all">REBOOT SYSTEM</button>
    </div>

    <div id="game-container"></div>

    <script>
        const languages = {
            en: {
                devicePrompt: "SELECT HARDWARE INTERFACE",
                namePrompt: "ENTER OPERATOR IDENTITY",
                tutorialTitle: "TRANSMISSION PROTOCOLS",
                pcInstructions: "• CONTROLS: Press [ SPACEBAR ] or [ UP ARROW ] to perform jumps.\n• HAZARDS: Realistic laser grids. Secure the core at 5,000 score to decide your fate.",
                mobileInstructions: "• CONTROLS: [ TAP ] anywhere on the screen to perform jump commands.\n• HAZARDS: Laser barriers. Reach 5,000 points to penetrate the Nexus Secure Core.",
                startGame: "INITIALIZE MATRIX GRID",
                deadTitle: "CRITICAL FAILURE",
                deadDesc: "Revive at checkpoint or restart from zero.",
                watchAd: "REVIVE SYSTEM",
                restart: "RESTART FROM ZERO"
            },
            bn: {
                devicePrompt: "আপনার ডিভাইস নির্বাচন করুন",
                namePrompt: "অপারেটরের নাম বা আইডি দিন",
                tutorialTitle: "গেম খেলার নিয়মাবলী",
                pcInstructions: "• কন্ট্রোল: লাফানোর জন্য কীবোর্ডের [ SPACEBAR ] অথবা [ UP ARROW ] চাপুন।\n• লক্ষ্য: সাইবার ডিস্ট্রিক্ট পার হয়ে ৫,০০০ স্কোর পূরণ করে মেইনফ্রেমে প্রবেশ করুন।",
                mobileInstructions: "• কন্ট্রোল: স্ক্রিনের যেকোনো জায়গায় [ TAP ] করে রোবটটিকে লাফ দেওয়ান।\n• লক্ষ্য: ৫,০০০ পয়েন্ট সংগ্রহ করে নেক্সাস কোর সুরক্ষিত করুন।",
                startGame: "ম্যাট্রিক্স গ্রিড চালু করুন",
                deadTitle: "সিস্টেম ক্র্যাশ করেছে!",
                deadDesc: "যেখানে মরেছেন সেখান থেকে খেলা শুরু করতে রিভাইভ করুন, অথবা ০ স্কোর নিয়ে শুরু থেকে খেলুন।",
                watchAd: "রিভাইভ করুন",
                restart: "শুরু থেকে খেলুন"
            }
        };

        let selectedLang = 'en';
        let selectedDevice = 'PC';
        let operatorName = 'Operator_01';
        let gameHasStarted = false;
        let phaserGameInstance = null;
        let audioContext = null;
        let currentScenePointer = null;
        let isGameRunning = false;

        // Advanced Audio Synthesis Engine
        class AudioEngine {
            constructor() {
                this.audioContext = null;
                this.masterGain = null;
                this.isPlaying = false;
                this.backgroundLoopId = null;
            }

            init() {
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.audioContext.createGain();
                    this.masterGain.gain.value = 0.35;
                    this.masterGain.connect(this.audioContext.destination);
                }
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    this.audioContext.resume();
                }
            }

            playBackgroundLoop() {
                if (this.isPlaying) return;
                this.init();
                this.isPlaying = true;
                this.scheduleBackgroundNotes();
            }

            stopBackgroundLoop() {
                this.isPlaying = false;
                if (this.backgroundLoopId) {
                    clearTimeout(this.backgroundLoopId);
                }
            }

            scheduleBackgroundNotes() {
                if (!this.isPlaying || !isGameRunning) return;

                let now = this.audioContext.currentTime;
                
                // Deep Synthwave Bass (45-57 Hz)
                let bass = this.audioContext.createOscillator();
                let bassGain = this.audioContext.createGain();
                bass.type = 'sine';
                let bassNotes = [45, 50, 57, 50];
                bass.frequency.setValueAtTime(bassNotes[Math.floor(now * 1.5) % bassNotes.length], now);
                bassGain.gain.setValueAtTime(0.12, now);
                bassGain.gain.linearRampToValueAtTime(0.1, now + 0.5);
                bass.connect(bassGain);
                bassGain.connect(this.masterGain);
                bass.start(now);
                bass.stop(now + 0.5);

                // Atmospheric Pad Layer
                let pad = this.audioContext.createOscillator();
                let padGain = this.audioContext.createGain();
                pad.type = 'triangle';
                let melodyNotes = [220, 247, 294, 247];
                pad.frequency.setValueAtTime(melodyNotes[Math.floor(now) % melodyNotes.length], now);
                padGain.gain.setValueAtTime(0.07, now);
                padGain.gain.linearRampToValueAtTime(0.05, now + 0.5);
                pad.connect(padGain);
                padGain.connect(this.masterGain);
                pad.start(now);
                pad.stop(now + 0.5);

                this.backgroundLoopId = setTimeout(() => this.scheduleBackgroundNotes(), 500);
            }

            playJumpSound() {
                this.init();
                let now = this.audioContext.currentTime;
                let osc = this.audioContext.createOscillator();
                let gain = this.audioContext.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.18);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playCrashSound() {
                this.init();
                let now = this.audioContext.currentTime;

                let crash = this.audioContext.createOscillator();
                let crashGain = this.audioContext.createGain();
                crash.type = 'sawtooth';
                crash.frequency.setValueAtTime(200, now);
                crash.frequency.linearRampToValueAtTime(50, now + 0.4);
                crashGain.gain.setValueAtTime(0.3, now);
                crashGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                crash.connect(crashGain);
                crashGain.connect(this.masterGain);
                crash.start(now);
                crash.stop(now + 0.5);
            }
        }

        let audioEngine = new AudioEngine();

        function selectLang(lang) {
            selectedLang = lang;
            document.getElementById('device-prompt').innerText = languages[lang].devicePrompt;
            document.getElementById('step-lang').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
        }

        function selectDevice(device) {
            selectedDevice = device;
            document.getElementById('name-prompt').innerText = languages[selectedLang].namePrompt;
            document.getElementById('step-device').classList.remove('active');
            document.getElementById('step-name').classList.add('active');
        }

        function confirmName() {
            let val = document.getElementById('player-name').value.trim();
            if(val) operatorName = val;
            document.getElementById('tutorial-title').innerText = languages[selectedLang].tutorialTitle;
            document.getElementById('tutorial-text').innerText = selectedDevice === 'PC' ? languages[selectedLang].pcInstructions : languages[selectedLang].mobileInstructions;
            document.getElementById('btn-start-game').innerText = languages[selectedLang].startGame;
            document.getElementById('step-name').classList.remove('active');
            document.getElementById('step-tutorial').classList.add('active');
        }

        function startGame() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            gameHasStarted = true;
            isGameRunning = true;
            audioEngine.init();
            audioEngine.playBackgroundLoop();
            initPhaserGame();
        }

        function triggerDeathMenu(scene) {
            currentScenePointer = scene;
            isGameRunning = false;
            audioEngine.stopBackgroundLoop();
            document.getElementById('ad-title').innerText = languages[selectedLang].deadTitle;
            document.getElementById('ad-desc').innerText = languages[selectedLang].deadDesc;
            document.getElementById('btn-watch-ad').innerText = languages[selectedLang].watchAd;
            document.getElementById('btn-skip-ad').innerText = languages[selectedLang].restart;
            document.getElementById('ad-modal').style.display = 'flex';
        }

        function watchRewardAd() {
            document.getElementById('ad-modal').style.display = 'none';
            if(currentScenePointer) {
                isGameRunning = true;
                audioEngine.playBackgroundLoop();
                currentScenePointer.revivePlayer();
            }
        }

        function skipAd() {
            document.getElementById('ad-modal').style.display = 'none';
            if(currentScenePointer) {
                isGameRunning = true;
                audioEngine.playBackgroundLoop();
                currentScenePointer.resetWholeGame();
            }
        }

        function triggerCinematicEnding() {
            isGameRunning = false;
            audioEngine.stopBackgroundLoop();
            if(phaserGameInstance) phaserGameInstance.destroy(true);
            let screen = document.getElementById('ending-screen');
            let title = document.getElementById('end-title');
            let story = document.getElementById('end-story');
            let isHappyEnding = Math.random() > 0.5;
            
            if(isHappyEnding) {
                screen.style.background = "radial-gradient(circle, #0c2b3a 0%, #030a10 100%)";
                title.style.color = "#00ffcc";
                if(selectedLang === 'en') {
                    title.innerText = "🎬 HAPPY ENDING: THE RESURGENCE";
                    story.innerText = "The Core terminal connects successfully! Operator [" + operatorName + "], your calculations saved the infrastructure. Neon blue pulses back into the grid trees.";
                } else {
                    title.innerText = "🎬 হ্যাপি এন্ডিং: মহাজাগতিক পুনরুত্থান";
                    story.innerText = "কোর টার্মিনাল সফলভাবে সংযুক্ত হয়েছে! অপারেটর [" + operatorName + "], আপনার নিখুঁত টাইমিং বিশ্বকে রক্ষা করেছে।";
                }
            } else {
                screen.style.background = "radial-gradient(circle, #3a0c14 0%, #0a0305 100%)";
                title.style.color = "#ff0055";
                if(selectedLang === 'en') {
                    title.innerText = "🎬 SAD ENDING: THE CRITICAL SACRIFICE";
                    story.innerText = "Emergency klaxons blare! To save the logs of Operator [" + operatorName + "], Unit-01 chooses self-sacrifice.";
                } else {
                    title.innerText = "🎬 স্যাড এন্ডিং: রোবটের আত্মত্যাগ";
                    story.innerText = "লাল রঙের ইমার্জেন্সি লাইট জ্বলে উঠল! অপারেটর [" + operatorName + "]-এর সমস্ত মেমরি ফাইল সুরক্ষিত রাখতে রোবটটি নিজেকে উৎসর্গ করলো।";
                }
            }
            screen.style.display = "flex";
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super();
            }

            preload() {}

            create() {
                let gameWidth = this.sys.game.config.width;
                let gameHeight = this.sys.game.config.height;
                
                let bgGraphics = this.add.graphics().setScrollFactor(0);
                bgGraphics.fillGradientStyle(0x05070f, 0x05070f, 0x10152b, 0x10152b, 1);
                bgGraphics.fillRect(0, 0, gameWidth, gameHeight);
                bgGraphics.lineStyle(1, 0x1e293b, 0.4);
                for(let i=0; i<gameWidth; i+=40) { bgGraphics.line(i, 0, i, gameHeight); }
                for(let j=0; j<gameHeight; j+=40) { bgGraphics.line(0, j, gameWidth, j); }

                this.platforms = this.physics.add.staticGroup();
                
                let groundY = gameHeight - 40;
                let startFloor = this.add.rectangle(gameWidth / 2, groundY, gameWidth * 2, 40, 0x111827).setStrokeStyle(2, 0x00ffcc);
                this.platforms.add(startFloor);

                for(let i=0; i<6; i++){
                    let platX = 400 + (i * 300);
                    let platY = gameHeight - 150 - (Math.random() * 120);
                    let p = this.add.rectangle(platX, platY, 180, 20, 0x111827).setStrokeStyle(2, 0xff0055);
                    this.platforms.add(p);
                }

                this.laserBarriers = this.physics.add.group({ allowGravity: false });
                let initialLaser = this.add.rectangle(700, gameHeight - 220, 6, 80, 0x00ffcc);
                this.tweens.add({ targets: initialLaser, alpha: 0.2, duration: 200, yoyo: true, loop: -1 });
                this.laserBarriers.add(initialLaser);

                this.player = this.add.rectangle(150, gameHeight - 150, 30, 50, 0x111827).setStrokeStyle(3, 0xff0055);
                this.physics.add.existing(this.player);
                this.player.body.setCollideWorldBounds(false);

                this.scoreText = this.add.text(20, 20, '', {
                    fontFamily: '"Courier New", Courier, monospace',
                    fontSize: '18px', fill: '#00ffcc', backgroundColor: '#0a0f1d', padding: { x: 10, y: 5 }
                }).setScrollFactor(0).setDepth(100);

                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.overlap(this.player, this.laserBarriers, this.hitHazard, null, this);

                if (selectedDevice === 'PC') {
                    this.input.keyboard.on('keydown-SPACE', this.triggerJump, this);
                    this.input.keyboard.on('keydown-UP', this.triggerJump, this);
                } else {
                    this.input.on('pointerdown', this.triggerJump, this);
                }

                this.cameras.main.setBounds(0, 0, 999999, gameHeight);
                this.cameras.main.startFollow(this.player, true, 0.1, 0, -150, 0);
                
                this.gameWidth = gameWidth;
                this.gameHeight = gameHeight;
                this.score = 0;
                this.targetScore = 5000;
            }

            update(time, delta) {
                if(!this.player || !this.player.body) return;

                this.player.body.setVelocityX(230 + (this.score * 0.015));

                let rightmostPlatformX = 0;
                this.platforms.getChildren().forEach(p => { if(p.x > rightmostPlatformX) rightmostPlatformX = p.x; });
                
                if(rightmostPlatformX < this.player.x + window.innerWidth + 300) {
                    let nextX = rightmostPlatformX + 220 + (Math.random() * 120);
                    let nextY = this.gameHeight - 120 - (Math.random() * 180);
                    let p = this.add.rectangle(nextX, nextY, 160, 20, 0x111827).setStrokeStyle(2, 0xff0055);
                    this.platforms.add(p);

                    if(Math.random() > 0.45) {
                        let l = this.add.rectangle(nextX + 50, nextY - 60, 6, 70, 0x00ffcc);
                        this.tweens.add({ targets: l, alpha: 0.3, duration: 250, yoyo: true, loop: -1 });
                        this.laserBarriers.add(l);
                    }
                }

                this.platforms.getChildren().forEach(p => { if(p.x < this.player.x - 500) p.destroy(); });
                this.laserBarriers.getChildren().forEach(l => { if(l.x < this.player.x - 500) l.destroy(); });

                if(this.player.body.velocity.x > 0 && this.player.y < this.gameHeight + 100) {
                    this.score += Math.floor(delta * 0.08);
                    this.scoreText.setText(operatorName.toUpperCase() + " LOGGED ENCRYPTION: " + this.score + " / " + this.targetScore);
                }

                if(this.score >= this.targetScore) triggerCinematicEnding();

                if(this.player.y > this.gameHeight + 100) {
                    this.physics.pause();
                    audioEngine.playCrashSound();
                    currentScenePointer = this;
                    triggerDeathMenu(this);
                }
            }

            triggerJump() {
                if(!this.player || !this.player.body) return;
                if(this.player.body.touching.down || this.player.body.blocked.down) {
                    this.player.body.setVelocityY(-650);
                    audioEngine.playJumpSound();
                }
            }

            hitHazard() {
                this.physics.pause();
                audioEngine.playCrashSound();
                currentScenePointer = this;
                triggerDeathMenu(this);
            }

            revivePlayer() {
                this.physics.resume();
                this.player.y = this.gameHeight - 300;
                this.player.body.setVelocityY(0);
                this.player.x += 100;
            }

            resetWholeGame() {
                this.score = 0;
                this.scene.restart();
            }
        }

        function initPhaserGame() {
            const config = {
                type: Phaser.AUTO,
                width: window.innerWidth,
                height: window.innerHeight,
                parent: 'game-container',
                backgroundColor: '#05070f',
                physics: {
                    default: 'arcade',
                    arcade: { gravity: { y: 1400 }, debug: false }
                },
                scene: GameScene
            };
            phaserGameInstance = new Phaser.Game(config);
        }

        document.addEventListener('click', () => { audioEngine.init(); }, true);
        document.addEventListener('touchstart', () => { audioEngine.init(); }, true);

        document.addEventListener("DOMContentLoaded", () => {
            const setup = document.getElementById('setup-screen');
            if(setup) setup.style.display = 'flex';
        });
    </script>
</body>
</html>
